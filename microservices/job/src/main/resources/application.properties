spring.application.name=job
server.port=8082

#DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/job_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
# The schema is created by database/job_db.sql, so Hibernate does not touch it.
# Use "update" instead if you want Hibernate to create/alter the tables itself.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Exposer les endpoints (health seul par défaut)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
#management.endpoint.health.show-components=always
eureka.client.healthcheck.enabled=true
# Depuis Spring Boot 2.6, /info est vide sans cette ligne
management.info.env.enabled=true

# Contenu affiché par /actuator/info
info.app.name=Job
info.app.version=1.0.0
info.app.description=Microservice de gestion des offres
